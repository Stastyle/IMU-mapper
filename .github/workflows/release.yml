name: Release

# Manual only. Builds a signed release APK and publishes a GitHub Release with the APK attached;
# the release action creates tag vX.Y.Z on the built commit as part of publishing, so a failed
# publish leaves no tag behind and the same version can simply be re-run. The in-app updater reads
# that release. Requires the four signing secrets; see scripts/gen-keystore.sh.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.0.0 (tag will be v1.0.0)"
        required: true
        type: string
      notes:
        description: "Release notes (markdown, optional)"
        required: false
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# One release at a time, so two dispatches of the same version cannot both pass the tag check.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        # app/build.gradle.kts derives versionCode = major*10000 + minor*100 + patch, so minor and
        # patch must stay below 100 for codes to remain monotonic.
        run: |
          re='^[0-9]+\.[0-9]{1,2}\.[0-9]{1,2}$'
          if ! [[ "$VERSION" =~ $re ]]; then
            echo "::error::version must be X.Y.Z with Y and Z below 100, got '$VERSION'"
            exit 1
          fi

      - name: Check signing secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KS" ] && missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -z "$KSP" ] && missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -z "$KA" ] && missing="$missing ANDROID_KEY_ALIAS"
          [ -z "$KP" ] && missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. Run scripts/gen-keystore.sh and add them under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse to reuse a tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "::error::tag v$VERSION already exists"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease -PversionName=${{ inputs.version }} --no-daemon --stacktrace
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/imu-mapper-v${{ inputs.version }}.apk"
          sha256sum "dist/imu-mapper-v${{ inputs.version }}.apk" | tee dist/SHA256SUMS.txt

      # Creates tag vX.Y.Z on this commit together with the release. No separate tag push: if
      # publishing fails there is no orphan tag, and re-running the same version still works.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          name: IMU Mapper v${{ inputs.version }}
          body: ${{ inputs.notes }}
          generate_release_notes: true
          prerelease: ${{ inputs.prerelease }}
          fail_on_unmatched_files: true
          files: |
            dist/imu-mapper-v${{ inputs.version }}.apk
            dist/SHA256SUMS.txt

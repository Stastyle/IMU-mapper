name: CI

# Compiles and tests on every push and pull request. Nothing is published: no APK is
# uploaded as an artifact or attached to a release. Releases are made only by release.yml.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: Pipeline tests (JVM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test pipeline
        working-directory: pipeline
        run: ../gradlew test --no-daemon --stacktrace
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-test-reports
          path: pipeline/build/reports/tests/test
          if-no-files-found: ignore

  app:
    name: App compile + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and test app
        # assembleDebug builds an APK on the runner to prove packaging works;
        # it is intentionally never uploaded.
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-test-reports
          path: app/build/reports/tests
          if-no-files-found: ignore
